server:
  port: ${SERVER_PORT:8095}
  servlet:
    context-path: /v1

spring:
  application:
    name: openwave-identity
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openwave_identity}
    username: ${DB_USER:openwave}
    password: ${DB_PASSWORD:openwave}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

registry:
  operator: "Neptune Fintech"
  operator-url: "https://www.neptune.ly"
  governance-charter-url: "https://github.com/neptune-ly/openwave-spec/blob/main/GOVERNANCE.md"
  source-code-url: "https://github.com/neptune-ly/openwave-identity"
  country-scope: "LY"
  future-operator: "Central Bank of Libya (planned)"
  uptime-sla: "99.9%"
  admin-key: ${REGISTRY_ADMIN_KEY}
  resolve-cache-ttl-seconds: 60
  resolve-rate-limit-per-minute: 120

identity:
  assets:
    branding-path: ${IDENTITY_BRANDING_ASSET_PATH:/opt/openwave/assets/identity-branding}
    public-base-url: ${IDENTITY_ASSET_PUBLIC_BASE_URL:${IDENTITY_PORTAL_URL:https://identity.neptune.ly}/v1/assets}
  notification:
    email:
      enabled: ${IDENTITY_NOTIFICATION_EMAIL_ENABLED:false}
      from: ${IDENTITY_NOTIFICATION_EMAIL_FROM:identity@neptune.ly}
      from-name: ${IDENTITY_NOTIFICATION_EMAIL_FROM_NAME:OpenWave Identity}
      portal-url: ${IDENTITY_PORTAL_URL:https://identity.neptune.ly}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
