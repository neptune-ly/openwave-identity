name: Issue Full-Bank Credential

on:
  workflow_dispatch:
    inputs:
      bank_handle:
        description: 'Fixed bank handle receiving the replacement credential'
        required: true
        type: choice
        options:
          - andalus
      label:
        description: 'Auditable rotation label (for example nexus-andalus-2026-08)'
        required: true
        type: string
permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed main and safe request
        env:
          BANK_HANDLE: ${{ inputs.bank_handle }}
          LABEL: ${{ inputs.label }}
        run: |
          test "${{ github.ref }}" = refs/heads/main || { echo '::error::credential issuance must be dispatched from main'; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || { echo '::error::checkout is not current origin/main'; exit 1; }
          test "$BANK_HANDLE" = andalus || { echo '::error::only the fixed Andalus cutover target is permitted'; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9 .:_-]{1,119}$ ]] || { echo '::error::invalid credential label'; exit 1; }
      - name: Issue and encrypt one-time credential
        env:
          BANK_HANDLE: ${{ inputs.bank_handle }}
          LABEL: ${{ inputs.label }}
          RECIPIENT_KEY: ${{ secrets.NEXUS_IDENTITY_CUTOVER_RSA_PUBLIC_KEY_B64 }}
          RECIPIENT_KEY_SHA256: ${{ vars.NEXUS_IDENTITY_CUTOVER_RSA_PUBLIC_KEY_SHA256 }}
          IDENTITY_BASE_URL: ${{ vars.IDENTITY_PUBLIC_BASE_URL || 'https://identity.neptune.ly/v1' }}
          REGISTRY_KEY: ${{ secrets.OPENWAVE_PROD_REGISTRY_ADMIN_KEY }}
          ATTESTATION_KEY: ${{ secrets.OPENWAVE_NEXUS_CUTOVER_ATTESTATION_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$REGISTRY_KEY" && test -n "$ATTESTATION_KEY" && test -n "$RECIPIENT_KEY" && [[ "$RECIPIENT_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::required pinned production material is unset'; exit 1; }
          workdir="$(mktemp -d)"; chmod 700 "$workdir"
          trap 'rm -rf "$workdir"' EXIT
          printf '%s' "$RECIPIENT_KEY" | base64 --decode >"$workdir/recipient.pem"
          openssl pkey -pubin -in "$workdir/recipient.pem" -noout
          test "$(sha256sum "$workdir/recipient.pem" | awk '{print $1}')" = "$RECIPIENT_KEY_SHA256" || { echo '::error::pinned recipient key fingerprint mismatch'; exit 1; }
          jq -cn --arg scope FULL_BANK --arg label "$LABEL" '{scope:$scope,label:$label}' >"$workdir/request.json"
          printf '%s\n' "url = \"$IDENTITY_BASE_URL/banks/$BANK_HANDLE/credentials\"" 'request = "POST"' 'silent' 'show-error' 'fail' 'max-time = 25' 'header = "Content-Type: application/json"' >"$workdir/curl.conf"
          printf 'header = "X-OpenWave-Registry-Key: %s"\n' "$REGISTRY_KEY" >>"$workdir/curl.conf"
          chmod 600 "$workdir/curl.conf"
          curl --config "$workdir/curl.conf" --data-binary "@$workdir/request.json" >"$workdir/response.json"
          jq -e '.credentialId and .bankHandle == "andalus" and .scope == "FULL_BANK" and (.keyFingerprint | test("^[0-9a-f]{64}$")) and .bankApiKey' "$workdir/response.json" >/dev/null
          jq -jr '.bankApiKey' "$workdir/response.json" >"$workdir/raw-key"
          key_fingerprint="$(sha256sum "$workdir/raw-key" | awk '{print $1}')"
          test "$key_fingerprint" = "$(jq -r '.keyFingerprint' "$workdir/response.json")" || { echo '::error::issued key fingerprint does not match Identity metadata'; exit 1; }
          openssl pkeyutl -encrypt -pubin -inkey "$workdir/recipient.pem" -in "$workdir/raw-key" -out "$workdir/ciphertext" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          ciphertext_sha256="$(sha256sum "$workdir/ciphertext" | awk '{print $1}')"
          jq -cn --arg bankHandle "$(jq -r '.bankHandle' "$workdir/response.json")" \
            --argjson credentialId "$(jq -r '.credentialId' "$workdir/response.json")" \
            --arg fingerprintSha256 "$key_fingerprint" \
            --arg scope FULL_BANK --arg ciphertextSha256 "$ciphertext_sha256" \
            '{bankHandle:$bankHandle,credentialId:$credentialId,fingerprintSha256:$fingerprintSha256,scope:$scope,ciphertextSha256:$ciphertextSha256}' >"$workdir/metadata.json"
          printf '%s' "$ATTESTATION_KEY" >"$workdir/attestation.key"; chmod 600 "$workdir/attestation.key"
          python3 - "$workdir/attestation.key" "$workdir/metadata.json" "$workdir/metadata.sig" <<'PY'
          import base64, hashlib, hmac, pathlib, sys
          key = pathlib.Path(sys.argv[1]).read_bytes()
          metadata = pathlib.Path(sys.argv[2]).read_bytes()
          pathlib.Path(sys.argv[3]).write_text(base64.b64encode(hmac.new(key, metadata, hashlib.sha256).digest()).decode() + "\n")
          PY
          base64 -w 0 "$workdir/metadata.json" >"$workdir/metadata.base64"
          base64 -w 0 "$workdir/ciphertext" >"$workdir/ciphertext.base64"
          rm -f "$workdir/raw-key" "$workdir/response.json" "$workdir/recipient.pem" "$workdir/attestation.key" "$workdir/ciphertext"
          mv "$workdir/metadata.base64" full-bank-credential-metadata.base64
          mv "$workdir/metadata.sig" full-bank-credential-metadata.sig
          mv "$workdir/ciphertext.base64" full-bank-credential-ciphertext.base64
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-full-bank-credential
          path: |
            full-bank-credential-metadata.base64
            full-bank-credential-metadata.sig
            full-bank-credential-ciphertext.base64
          retention-days: 1
