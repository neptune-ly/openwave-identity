# Deploy the OPENWAVE IDENTITY registry to production.
#
# The repository's other workflow ("Deploy Pages") publishes DOCUMENTATION to
# GitHub Pages and touches no running service. Until this existed, shipping the
# registry meant somebody SSH-ing in by hand, with no record of who deployed
# what or whether it came back up.
#
# ## No SSH key lives in this repository
#
# The first version of this workflow reached the host over SSH, which meant a
# private key in GitHub secrets — and it NEVER RAN ONCE, because nobody pasted
# one in. Everywhere the estate actually deploys (andalus, nexus, neptune-plus)
# it uses a runner registered on the machine, authenticating with the workflow's
# own `github.token`. No long-lived credential is stored anywhere, and nothing
# off the box can use it.
#
# ## One runner serves both OpenWave services
#
# Identity and Astro are sibling checkouts under /opt/openwave brought up by one
# compose file. Register the runner at the ORGANISATION level (neptune-ly) and
# both repos use the same one — one machine, one runner, two services.
#
# ## Why it probes resolution and not just health
#
# On 2026-08-01 this exact surface returned HTTP 500 for every input for a full
# day while /actuator/health reported UP throughout, because health only asks
# whether the process is running. A staff tester was the detection mechanism,
# which is not a mechanism. A clean 404 for an unknown handle is a PASS; a 5xx
# fails the run.
#
# ## One-time setup, in two deliberate halves
#
#   1. Org Settings -> Actions -> Runners -> New runner, on the OpenWave box,
#      labels:  self-hosted, openwave, astro-app
#      (grant it access to neptune-astro AND openwave-identity)
#   2. Settings -> Variables -> IDENTITY_PROD_ENABLED = true
#
# The second is not ceremony: a job targeting a runner that does not exist does
# not fail, it QUEUES indefinitely, which reads as a slow deploy rather than an
# unconfigured one. The estate learned this twice already
# (ANDALUS_PROD17_ENABLED, NEXUS_PROD210_ENABLED).

name: Deploy Service

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy'
        required: true
        default: 'main'
      probe_handle:
        description: 'Handle used for the post-deploy resolution probe (a 404 passes, a 5xx fails)'
        required: true
        default: 'deploy-probe-does-not-exist'

# Identity and Astro share a host and a compose project, so their deploys must
# not interleave — a `docker compose up` from each at once is how a box ends up
# serving neither. Same concurrency group as the Astro workflow on purpose.
concurrency:
  group: openwave-box-deploy
  cancel-in-progress: false

jobs:
  # Runs on GitHub's own runners so it answers even when no self-hosted runner
  # exists — which is the entire point.
  guard:
    name: Check the deploy target is configured
    runs-on: ubuntu-latest
    steps:
      - name: Require IDENTITY_PROD_ENABLED
        run: |
          if [ "${{ vars.IDENTITY_PROD_ENABLED }}" != "true" ]; then
            echo "::error::IDENTITY_PROD_ENABLED is not 'true'."
            echo "Identity deploys are blocked until the self-hosted runner is installed and"
            echo "the switch is turned on deliberately:"
            echo ""
            echo "  1. Org Settings -> Actions -> Runners -> New runner, on the OpenWave box"
            echo "     labels: self-hosted, openwave, astro-app"
            echo "  2. Settings -> Variables -> IDENTITY_PROD_ENABLED = true"
            echo ""
            echo "NOTE: /opt/openwave/openwave-identity is not yet a git checkout — it was"
            echo "assembled by rsync. The deploy script refuses and prints the conversion"
            echo "steps rather than guessing at a tree nobody has reconciled."
            exit 1
          fi
          echo "Deploy target enabled."

  deploy:
    name: Deploy identity registry
    needs: guard
    runs-on:
      - self-hosted
      - openwave
      - astro-app
    timeout-minutes: 30

    steps:
      - name: Checkout the deploy script
        uses: actions/checkout@v4

      - name: Deploy and verify
        env:
          APP_DIR: /opt/openwave/openwave-identity
          COMPOSE_DIR: /opt/openwave/neptune-astro/deploy/hetzner
          COMPOSE_FILE: docker-compose.app.yml
          DEPLOY_REF: ${{ inputs.ref }}
          PROBE_HANDLE: ${{ inputs.probe_handle }}
          # Public origin plus the /v1 context path, not a secret.
          PUBLIC_BASE_URL: ${{ vars.IDENTITY_PUBLIC_BASE_URL || 'https://identity.neptune.ly/v1' }}
          DEPLOY_GITHUB_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-prod-self-hosted.sh
